name: Update S2 Supplies Data

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-supplies:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch supplies data
        run: |
          curl -L \
            --fail \
            --silent \
            --show-error \
            "https://cpt-hedge.com/api/coordinates?season=2" \
            -o maps/supplies/data/test-data.json

      - name: Validate JSON
        run: |
          python -m json.tool maps/supplies/data/test-data.json > /dev/null

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add maps/supplies/data/test-data.json

          if git diff --cached --quiet; then
            echo "No changes detected."
          else
            git commit -m "Update S2 supplies data"
            git push
          fi
