<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>S2 Supplies Map</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="container">
        <header>
            <h1>S2 Supplies Map</h1>
            <div id="dataUpdated" class="data-updated">
                Data updated: loading...
            </div>
        </header>

        <section class="stats">
            <div class="stat">
                <span class="stat-label">Supplies</span>
                <span id="supplyCount" class="stat-value">Loading...</span>
            </div>
        </section>

        <section class="map-section">
            <div id="map" class="map"></div>
        </section>

        <section class="table-section">
            <h2>Supplies</h2>

            <div class="table-controls">
                <input
                    type="text"
                    id="searchInput"
                    placeholder="Search..."
                    autocomplete="off"
                >

                <select id="levelFilter">
                    <option value="all">All Levels</option>
                </select>
            </div>

            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th>Level</th>
                            <th>X</th>
                            <th>Y</th>
                        </tr>
                    </thead>
                    <tbody id="supplyTableBody">
                    </tbody>
                </table>
            </div>
        </section>
    </main>

    <script src="app.js"></script>
</body>
</html>
